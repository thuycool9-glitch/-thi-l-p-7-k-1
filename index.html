<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENGLISH 7 – MID-TERM 1 EXAM CHALLENGE 2026–2027</title>
<style>
:root{--bg:#eef6ff;--card:#fff;--ink:#1f2a44;--muted:#5d6b88;--p:#4f6df5;--p2:#7c4dff;--ok:#18a957;--okbg:#e3f8ec;--bad:#e5484d;--badbg:#fdeceb;--warn:#f59e0b;--line:#dbe4f5;--u1:#ff7a59;--u2:#22b573;--u3:#3b82f6}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:linear-gradient(160deg,#eaf3ff,#f6efff 60%,#fff6ec);color:var(--ink);min-height:100vh;font-size:17px;line-height:1.5}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 4px 0 rgba(60,50,150,.35);transition:transform .08s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(60,50,150,.35)}
.btn.sec{background:#fff;color:var(--p);border:2px solid var(--p);box-shadow:none}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #0d7a3f}
.btn.warn{background:var(--warn);box-shadow:0 4px 0 #b36f00}
.btn.red{background:var(--bad);box-shadow:0 4px 0 #a02a2e}
.btn.sm{padding:8px 14px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.card{background:var(--card);border-radius:22px;box-shadow:0 8px 28px rgba(60,80,160,.13);padding:22px}
/* HOME */
.hero{text-align:center;padding:26px 16px 10px}
.hero h1{font-size:clamp(26px,5vw,44px);margin:6px 0;background:linear-gradient(90deg,var(--p),var(--p2),#ff6b9a);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15}
.hero .year{display:inline-block;background:#fff;border-radius:999px;padding:4px 16px;font-weight:700;color:var(--p2);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.hero svg{max-width:340px;width:80%;height:auto}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:18px 0}
.tcard{border-radius:20px;padding:16px;color:#fff;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.tcard .ic{font-size:36px}.tcard h3{margin:4px 0}.tcard small{opacity:.95}
.t1{background:linear-gradient(135deg,#ff9a5a,#ff6a4d)}.t2{background:linear-gradient(135deg,#34d399,#16a06a)}.t3{background:linear-gradient(135deg,#60a5fa,#3b6fe0)}
.homebtns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:16px 0}
.homebtns .btn{min-width:210px;font-size:18px}
.opts-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;margin:8px 0;color:var(--muted)}
.seg{display:inline-flex;border:2px solid var(--p);border-radius:12px;overflow:hidden}
.seg label{padding:8px 14px;cursor:pointer;font-weight:600;color:var(--p)}
.seg input{display:none}.seg input:checked+span{background:var(--p);color:#fff}
.seg span{display:block;margin:-8px -14px;padding:8px 14px}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
/* SETUP */
.setup h2{margin-top:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.opt{border:2px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;background:#fff;text-align:left;display:block;width:100%}
.opt:hover{border-color:var(--p)}
.opt.sel{border-color:var(--p);background:#eef1ff;box-shadow:0 0 0 3px rgba(79,109,245,.18)}
.opt b{display:block}.opt small{color:var(--muted)}
.field{margin:14px 0}.field>label{font-weight:700;display:block;margin-bottom:6px}
select{font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--line)}
/* GAME */
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.pill.time{color:var(--p2)}.pill.time.low{color:var(--bad);animation:pulse 1s infinite}
.bar{height:12px;background:#dfe7f7;border-radius:999px;overflow:hidden;margin:6px 0 14px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));width:0;transition:width .3s}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:#eef1ff;color:var(--p)}
.chip.u1{background:#fff0ea;color:#d4501f}.chip.u2{background:#e3f8ec;color:#0d7a3f}.chip.u3{background:#e6efff;color:#2753c9}
.qcard{animation:slide .25s ease}
.stem{font-size:1.1em;font-weight:600;margin:6px 0 12px}
.ctx{background:#f7f9ff;border:1px solid var(--line);border-left:5px solid var(--p);border-radius:12px;padding:10px 14px;margin-bottom:12px;max-height:300px;overflow:auto;font-size:.95em}
.ctx h4{margin:0 0 6px;color:var(--p2)}.ctx p{margin:6px 0}.ctx ol{margin:6px 0;padding-left:22px}
.blank{display:inline-block;min-width:60px;text-align:center;border-bottom:2px solid var(--muted);color:var(--muted)}
.blank.cur{background:#fff3c4;border-bottom-color:var(--warn);color:#8a5a00;font-weight:800;padding:0 6px;border-radius:6px}
.qimg{display:block;margin:6px auto 12px;max-width:min(320px,90%);max-height:260px;border-radius:12px;border:2px solid var(--line);background:#fff}
.imgnote{text-align:center;font-size:12px;color:var(--muted);margin-top:-8px;margin-bottom:10px}
.answers{display:grid;gap:10px}
.answers.two{grid-template-columns:1fr 1fr}
.ans{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;color:var(--ink);transition:.12s}
.ans:hover:not(:disabled){border-color:var(--p);background:#f4f6ff}
.ans .l{flex:none;width:30px;height:30px;border-radius:50%;background:#eef1ff;color:var(--p);font-weight:800;display:grid;place-items:center}
.ans.sel{border-color:var(--p);background:#eef1ff}.ans.sel .l{background:var(--p);color:#fff}
.ans.right{border-color:var(--ok);background:var(--okbg)}.ans.right .l{background:var(--ok);color:#fff}
.ans.wrong{border-color:var(--bad);background:var(--badbg);animation:shake .35s}.ans.wrong .l{background:var(--bad);color:#fff}
.ans:disabled{cursor:default}
.ans u{text-decoration-thickness:2px}
textarea,input[type=text]{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line)}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--p)}
.cue{background:#fff8e1;border:1px dashed var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-weight:700}
.prefix{font-weight:700;color:var(--p2);margin-bottom:4px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;border-radius:12px}
.tiles.pool{background:#f3f5fb}.tiles.dest{background:#fff;border:2px dashed var(--p)}
.tile{border:2px solid var(--p);background:#fff;color:var(--p);border-radius:10px;padding:6px 12px;font-weight:700}
.tile:hover{background:#eef1ff}
.tiles.dest .tile{background:var(--p);color:#fff}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;animation:pop .25s}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)}.fb.no{background:var(--badbg);border:2px solid var(--bad)}
.fb h4{margin:0 0 4px}.fb .sample{font-weight:700}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:16px;align-items:center}
.nav .grp{display:flex;gap:10px;flex-wrap:wrap}
.flagbtn.on{background:var(--warn);color:#fff;border-color:var(--warn)}
.tr-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
/* palette */
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin:10px 0}
.pb{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 0;font-weight:700;position:relative}
.pb.ans1{background:#e6efff;border-color:var(--p)}.pb.cur{outline:3px solid var(--p2)}
.pb.ok{background:var(--okbg);border-color:var(--ok)}.pb.no{background:var(--badbg);border-color:var(--bad)}
.pb.fl::after{content:"⚑";position:absolute;top:-6px;right:-2px;color:var(--warn);font-size:16px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,30,60,.5);display:grid;place-items:center;z-index:50;padding:14px}
.modal .box{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.modal h3{margin-top:0}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
/* result */
.score{font-size:54px;font-weight:900;text-align:center;color:var(--p2);line-height:1}
.badge{text-align:center;font-size:26px;font-weight:800;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:#f3f6ff;border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:24px}
.skill{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.skill .tr{height:14px;background:#e4eaf7;border-radius:999px;overflow:hidden}.skill .tr i{display:block;height:100%;background:var(--ok)}
.skill .tr i.mid{background:var(--warn)}.skill .tr i.low{background:var(--bad)}
.wrongitem{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.wrongitem .q{font-weight:600}.wrongitem .c{color:var(--ok);font-weight:700}.wrongitem .y{color:var(--bad)}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f2a44;color:#fff;padding:10px 18px;border-radius:999px;z-index:80;font-weight:600}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:10px;height:14px;animation:fall 1.4s linear forwards}
@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.5}}
@keyframes fall{to{transform:translateY(105vh) rotate(500deg);opacity:.8}}
body.noanim *{animation:none!important;transition:none!important}
body.noanim .confetti{display:none}
@media(max-width:640px){body{font-size:16px}.card{padding:14px;border-radius:16px}.answers.two{grid-template-columns:1fr 1fr}.skill{grid-template-columns:110px 1fr 56px}.btn{padding:11px 14px}.homebtns .btn{min-width:100%}}
@media print{.nav,.top,.btn{display:none}}

</style>
</head>

 </div>

 <div class="card" id="qarea"></div>
 <div class="nav">
  <div class="grp"><button class="btn sec" id="bBack">◀ BACK</button><button class="btn" id="bNext">NEXT ▶</button></div>

</div>

  tr1: { title: "Part 1 – Healthy habits (transcript)", listen: true, html:
`<p>Healthy habits help us keep fit and avoid disease. Here is some advice.</p>
<p>Eat more fruits and vegetables, especially coloured ones, like carrots and tomatoes. They provide a lot of vitamins.</p>
<p>Eat meat, eggs, and cheese, but not too much. You may put on weight.</p>
<p>Drink enough water, but not soft drinks.</p>
<p>Be active and exercise every day. Do outdoor activities like cycling, swimming, or playing sports. They keep you fit.</p>
<p>Go to bed early and get about eight hours of sleep daily, so you will not feel tired.</p>
<p>Keep your room tidy and clean. Open windows to let in fresh air and sunshine on fine days.</p>` },
  tr2: { title: "Part 2 – My favourite hobby is reading (transcript)", listen: true, html:
`<p>My favorite hobby is reading. I enjoy reading a book when I have free time. I started to do it when I was four years old. The first time I did it, I felt interested, so I kept reading.</p>
<p>The teachers always told me to read the difficult words. I was happy when I read a story with a happy ending. I was thrilled when I read a detective story.</p>
<p>I enjoy reading because I like to explore the imaginative world of my favorite author J. K. Rowling, who writes Harry Potter.</p>
<p>There are a lot of advantages of reading. Reading can make me relax and calm. I can also learn new vocabulary items. Then I can further improve my English. Moreover, it can give me an unlimited imagination, so I can write books in the future. I can learn the different cultures of other countries in the world too.</p>
<p>I read at least one hour every day. I read books by myself at home. I wish I could read different kinds of books because it might be very challenging.</p>` },

`<p>Playing the piano is my favorite hobby. ________________.</p>
<p><b>a.</b> I started learning how to play the piano two years ago.<br><b>b.</b> I often play the piano in my free time.<br><b>c.</b> It helps me relax and makes me happy.</p>` },

  eat33: { title: "Healthy Eating Habits", html:
`<p>Having a healthy diet is important. ________________.</p>
<p><b>a.</b> Moreover, you should drink enough water and shouldn’t eat too many fried foods.<br><b>b.</b> Eating healthy helps you stay strong and active.<br><b>c.</b> It is important to eat a variety of foods, such as fruits, vegetables, and grains,…</p>` },

  help35: { title: "Helping the Community", html:
`<p>Community service is important. ________________.</p>
<p><b>a.</b> Last weekend, I joined a group of students to clean up the local park.<br><b>b.</b> We collected trash, planted trees, and painted benches to make the park more beautiful.<br><b>c.</b> I felt great to help the environment and make our community a better place.</p>` },
  help36: { title: "Helping the Community (đúng thứ tự theo đáp án câu 35: a-b-c)", html:
`<p>Community service is important. Last weekend, I joined a group of students to clean up the local park. We collected trash, planted trees, and painted benches to make the park more beautiful. I felt great to help the environment and make our community a better place. ________________.</p>` },
  garden: { title: "MY GRANDPARENTS’ GARDEN", html:
`<ol><li>My grandparents ({{37}}) a big garden with a lot of vegetables.</li>
<li>Vegetables come in different shapes, sizes, and ({{38}}).</li>
<li>They grow carrots and potatoes ({{39}}) the ground.</li>
<li>My grandfather says that coloured vegetables are very good for health ({{40}}) they provide a lot of natural vitamins.</li></ol>` },
  vol: { title: "The benefits of voluntary work", html:
`<p>Nowadays, volunteer work attracts a large number of attendants from different age groups because of its huge benefits. Firstly, voluntary work provides the <b>adolescents</b> many precious opportunities to develop social skills, foster independence and form the ability to deal with difficulties in different situations. Secondly, every member will be taught how to work in a team, the way to make conversation or the responsibility of finishing a task. The experience you gain will be <b>valuable</b> for your future, helping you tackle serious problems in later life. In addition, volunteer work can help us adapt to something new and make many new friends through regular activities of clubs or organizations. We can also have a chance to travel more and explore more interesting things we have not experienced before. In conclusion, it is very good to do voluntary work.</p>` },
  bfast: { title: "Breakfast", html:
`<p>Breakfast is the ({{47}}) important meal of the day. It provides the nutrients your body needs for good health, the calories it needs for ({{48}}) and helps to maintain your blood sugar level. Studies have shown that people who don’t have breakfast have a low blood sugar level and are often slow, tired, hungry and ({{49}}) to concentrate. Surprisingly, breakfast actually plays an important part in weight control. It's easier to ({{50}}) weight if you eat in the morning rather than later in the day. Dividing the day’s calories ({{51}}) three meals helps you keep fit more efficiently than ({{52}}) breakfast and having two larger meals a day.</p>` },
  remedy: { title: "Natural remedies (4 câu bị bỏ → 4 chỗ trống)", html:
`<p>Many people today are trying to live healthier lives. ({{53}}). Some people also turn to natural remedies when they feel sick. ({{54}}) For example, many drink ginger tea when they have a sore throat or feel cold.</p>
<p>However, not all natural remedies are safe for everyone. ({{55}}) It’s important to ask a doctor before using herbs, especially if you are already taking medicine. Even something natural can be harmful when used in large amounts.</p>
<p>({{56}}) Choosing safe options and learning more about your health can help you feel better and avoid serious problems in the future.</p>` },
  hobby: { title: "Hobbies", html:
`<p>Hobbies give us pleasure and help us relax after stressful working hours. There are many types of hobbies such as collecting things, playing sports, or ({{21}}) crafts. Some hobbies are very cheap, while others can be quite expensive. For example, collecting glass bottles is a cheap hobby because you can find empty bottles everywhere. All you need to do is clean them and keep them in a safe place. ({{22}}), making dollhouses requires more time and patience. You have to buy glue, cardboard, and small tools to build furniture. No matter what your hobby is, it can bring you many ({{23}}). First, it helps you learn new skills and ({{24}}) your creativity. Second, sharing your hobby with friends makes you feel happier and more ({{25}}).</p>` },
  life: { title: "Healthy lifestyle", html:
`<p>Many teenagers today face health problems because of bad eating habits and lack of physical exercise. A recent survey shows that more than 30% of secondary school students eat fast food at least three times a week. Fast food contains a lot of fat, salt, and sugar, which can lead to overweight and obesity. Furthermore, many students spend hours sitting in front of screens playing video games instead of doing outdoor activities.</p>
<p>To build a healthy lifestyle, doctors suggest that teenagers should change their daily routines. First, <b>they</b> should replace soft drinks and junk food with fresh fruit, vegetables, and plain water. Fresh fruits provide essential vitamins that boost the immune system. Second, doing at least 30 minutes of physical exercise every day, such as cycling, swimming, or playing badminton, helps keep the body fit and strong. Finally, getting enough sleep (8 to 9 hours per night) is crucial for mental and physical recovery.</p>` }
};

{id:"DC-57",src:"DC",no:57,type:"mc",unit:2,skill:"writing",diff:2,stem:"Choose the sentence that is closest in meaning to: <i>She eats fruits and veggies every day, but she keeps gaining weight.</i>",
 opts:["Although she eats fruits and veggies every day, she keeps gaining weight.","Although she keeps gaining weight, she eats only fast food.","Because she eats fruits and veggies every day, she keeps gaining weight.","Although she doesn’t eat fruits, she still gains weight."],ans:0,
 exp:"“but” (đối lập) → Although + mệnh đề. (Lỗi chính tả “weigh” ở phương án C của tài liệu gốc đã được sửa thành “weight”.)",flag:true},
{id:"DC-58",src:"DC",no:58,type:"mc",unit:2,skill:"writing",diff:1,stem:"Choose the sentence that is closest in meaning to: <i>It's a good idea to do exercise regularly.</i>",
 opts:["You should never do exercise even if it’s a good idea.","You should do exercise regularly.","You should avoid doing exercise for good health.","You should not do regular exercise."],ans:1,
 exp:"“It’s a good idea to…” tương đương “You should…”."},
{id:"DC-59",src:"DC",no:59,type:"mc",unit:3,skill:"writing",diff:2,stem:"Choose the sentence made from the cues: <i>Every year / we / collect / old / books / clothes / help / poor / children / mountainous areas.</i>",
 opts:["Every year, we collect old books and clothes to help poor children in mountainous areas.","Every year, collect we old books clothes help poor children mountainous areas.","We collect every year old books clothes to help children poor mountainous areas.","Every year, we help poor children collect old books and clothes mountainous areas."],ans:0,
 exp:"Câu A đủ chủ ngữ, động từ, tân ngữ và mục đích (to help…)."},
{id:"DC-60",src:"DC",no:60,type:"mc",unit:3,skill:"writing",diff:1,stem:"Choose the sentence made from the cues: <i>volunteer / in / community / make / difference.</i>",
 opts:["Volunteer in community make difference.","Volunteers in the community make a difference.","Community volunteer make difference in.","Make volunteer difference in community."],ans:1,
 exp:"Chủ ngữ số nhiều “Volunteers” đi với “make”: Volunteers in the community make a difference."},
{id:"DC-61",src:"DC",no:61,type:"type",unit:2,skill:"writing",diff:2,stem:"Complete the sentence with the given words (add words and change the form if necessary).",
 cue:"Do / exercise / regularly / help / you / stay / healthy",
 accept:["Doing exercise regularly helps you stay healthy.","Doing exercise regularly helps you to stay healthy.","Does doing exercise regularly help you stay healthy?"],
 sample:"Doing exercise regularly helps you stay healthy.",
 exp:"“Doing exercise regularly” là cụm V-ing làm chủ ngữ (số ít) → helps. Cấu trúc help + O + V: helps you stay healthy.",flag:true},
{id:"DC-62",src:"DC",no:62,type:"type",unit:1,skill:"writing",diff:1,stem:"Complete the sentence with the given words.",
 cue:"She / enjoy / read / books",
 accept:["She enjoys reading books."],sample:"She enjoys reading books.",
 exp:"enjoy + V-ing → enjoys reading."},
{id:"DC-63",src:"DC",no:63,type:"type",unit:1,skill:"writing",diff:2,stem:"Complete the sentence with the given words.",
 cue:"She / start / the hobby / when / she / 6",
 accept:["She started the hobby when she was six years old.","She started the hobby when she was six.","She started the hobby when she was 6 years old.","She started the hobby when she was 6."],
 sample:"She started the hobby when she was six years old.",
 exp:"Sự việc xảy ra trong quá khứ → started; mệnh đề when cũng dùng was."},
{id:"DC-64",src:"DC",no:64,type:"type",unit:2,skill:"writing",diff:3,stem:"Complete the sentence with the given words.",
 cue:"Get / enough / sleep / night / be / good / for / you",
 accept:["Getting enough sleep at night is good for you.","Getting enough sleep every night is good for you.","Getting enough sleep each night is good for you."],
 sample:"Getting enough sleep at night is good for you.",
 exp:"Cụm V-ing “Getting enough sleep” làm chủ ngữ; be good for = tốt cho."},
{id:"DC-65",src:"DC",no:65,type:"type",unit:2,skill:"writing",diff:2,stem:"Complete the sentence with the given words.",
 cue:"You / can / ride / bike / run / or / go / swim",
 accept:["You can ride a bike, run, or go swimming.","You can ride a bike or run or go swimming."],
 sample:"You can ride a bike, run, or go swimming.",
 exp:"Sau can dùng động từ nguyên mẫu (ride, run); “go swimming” là cụm cố định."},
{id:"DC-66",src:"DC",no:66,type:"type",unit:1,skill:"writing",diff:2,stem:"Complete the second sentence so that it has a similar meaning to the first one, using the word in brackets.<br><i>She loves collecting old comic books.</i> <b>(fond)</b>",
 accept:["She is fond of collecting old comic books."],sample:"She is fond of collecting old comic books.",
 exp:"be fond of + V-ing = thích làm gì, tương đương love + V-ing."},
{id:"DC-67",src:"DC",no:67,type:"type",unit:1,skill:"writing",diff:2,stem:"Complete the second sentence so that it has a similar meaning to the first one, using the word in brackets.<br><i>She likes singing more than dancing.</i> <b>(prefers)</b>",
 accept:["She prefers singing to dancing."],sample:"She prefers singing to dancing.",
 exp:"prefer A to B; khi nói về hoạt động dùng V-ing: prefers singing to dancing."},
{id:"DC-68",src:"DC",no:68,type:"type",unit:1,skill:"writing",diff:2,stem:"Complete the second sentence so that it has a similar meaning to the first one, using the word in brackets.<br><i>There are over two hundred stamps in Nam’s collection.</i> <b>(has)</b>",
 accept:["Nam has over two hundred stamps in his collection."],sample:"Nam has over two hundred stamps in his collection.",
 exp:"There are … in Nam’s collection → Nam has … in his collection."},
{id:"DC-69",src:"DC",no:69,type:"type",unit:1,skill:"writing",diff:2,stem:"Complete the second sentence so that it has a similar meaning to the first one.<br><i>My sister enjoys arranging flowers.</i>",
 prefix:"My sister’s hobby",accept:["My sister’s hobby is arranging flowers."],sample:"My sister’s hobby is arranging flowers.",
 exp:"enjoys arranging flowers → hobby is arranging flowers."},
{id:"DC-70",src:"DC",no:70,type:"type",unit:1,skill:"writing",diff:2,stem:"Complete the second sentence so that it has a similar meaning to the first one.<br><i>My brother loves playing tennis. I love playing tennis.</i>",
 prefix:"My brother and",accept:["My brother and I love playing tennis."],sample:"My brother and I love playing tennis.",
 exp:"Hai câu cùng nói về một sở thích nên ghép chủ ngữ bằng “and”: My brother and I; động từ giữ dạng love."},

{id:"D1-28",src:"D1",no:28,type:"mc",unit:2,skill:"reading",diff:1,ctx:"life",stem:"Why is fast food harmful to health?",

{id:"D1-33",src:"D1",no:33,type:"mc",unit:2,skill:"writing",diff:2,errfix:true,

{id:"D1-34",src:"D1",no:34,type:"mc",unit:2,skill:"writing",diff:2,errfix:true,

{id:"D1-36",src:"D1",no:36,type:"type",unit:1,skill:"writing",diff:2,stem:"Rewrite the sentence so that it is closest in meaning.<br><i>My father finds collecting old stamps very interesting.</i>",

<script>
(function(){
"use strict";
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const SKILL={phonetics:"Phonetics",stress:"Word Stress",vocab:"Vocabulary & Grammar",signs:"Signs & Notices",reading:"Reading",listening:"Listening (transcript)",writing:"Writing"};
const UNIT={0:"Chung (General)",1:"Unit 1: Hobbies",2:"Unit 2: Healthy Living",3:"Unit 3: Community Service"};
const TOPICS=[
 {k:"u1",name:"Unit 1: Hobbies",ic:"🎨",f:q=>q.unit===1},
 {k:"u2",name:"Unit 2: Healthy Living",ic:"🥗",f:q=>q.unit===2},
 {k:"u3",name:"Unit 3: Community Service",ic:"🤝",f:q=>q.unit===3},
 {k:"ps",name:"Phonetics and Stress",ic:"🔊",f:q=>q.skill==="phonetics"||q.skill==="stress"},
 {k:"vg",name:"Vocabulary and Grammar",ic:"📚",f:q=>q.skill==="vocab"},
 {k:"sg",name:"Signs & Notices",ic:"🪧",f:q=>q.skill==="signs"},
 {k:"rd",name:"Reading",ic:"📖",f:q=>q.skill==="reading"},
 {k:"ls",name:"Listening (transcript)",ic:"🎧",f:q=>q.skill==="listening"},
 {k:"wr",name:"Writing",ic:"✍️",f:q=>q.skill==="writing"},
 {k:"mx",name:"Mixed Challenge",ic:"🎲",f:q=>true}
];
const SETS={
 D1:{name:"Đề 1 – Đề kiểm tra giữa kì I",sub:"40 câu, theo cấu trúc Listening / Use of Language / Reading / Writing",f:q=>q.src==="D1",mins:60},
 DC:{name:"Đề cương – Bài tập tham khảo",sub:"70 câu (Phonetics → Writing)",f:q=>q.src==="DC",mins:90},
 ALL:{name:"Tổng hợp cả hai tài liệu",sub:"110 câu, Đề cương trước rồi đến Đề 1",f:q=>true,mins:120}
};
const SRCNAME={DC:"Đề cương",D1:"Đề 1"};

/* ---------- helpers ---------- */
function norm(s){return String(s||"").toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”"]/g,"").replace(/[.,!?;:]/g,"").replace(/\s+/g," ").trim();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function strip(h){const d=document.createElement("div");d.innerHTML=h;return d.textContent||"";}
function fmtTime(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60),r=s%60;return m+":"+String(r).padStart(2,"0");}
const L="ABCD";
function qLabel(q){return SRCNAME[q.src]+" – câu "+q.no;}
function letter(q,i){return q.type==="tf"?(i===0?"T":"F"):L[i];}
function optsOf(q){return q.type==="tf"?["True","False"]:q.opts;}

/* ---------- settings / sound / fx ---------- */
const cfg={timed:LS.get("e7_timed")==="1",sound:LS.get("e7_sound")!=="0",fx:LS.get("e7_fx")!=="0"};
let actx=null;
function beep(ok){
 if(!cfg.sound)return;
 try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const seq=ok?[[660,0],[880,.12]]:[[220,0],[180,.14]];
  seq.forEach(([f,t])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=ok?"sine":"triangle";o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.14);});
 }catch(e){}
}
function confetti(){
 if(!cfg.fx)return;
 const c=document.createElement("div");c.className="confetti";
 const cols=["#4f6df5","#7c4dff","#ff6b9a","#22b573","#f59e0b","#3b82f6"];
 for(let i=0;i<38;i++){const e=document.createElement("i");e.style.left=Math.random()*100+"%";e.style.background=cols[i%cols.length];e.style.animationDelay=(Math.random()*.4)+"s";e.style.transform="rotate("+Math.random()*360+"deg)";c.appendChild(e);}
 document.body.appendChild(c);setTimeout(()=>c.remove(),2000);
}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400);}
function applyFx(){document.body.classList.toggle("noanim",!cfg.fx);}

/* ---------- screens ---------- */
function show(id){["home","setup","game","result"].forEach(s=>$("#screen-"+s).classList.toggle("hidden",s!==id));window.scrollTo(0,0);}
function openModal(html){const m=$("#modal");$("#modalbox").innerHTML=html;m.classList.remove("hidden");}
function closeModal(){$("#modal").classList.add("hidden");$("#modalbox").innerHTML="";}
function modalOpen(){return !$("#modal").classList.contains("hidden");}

/* ---------- HOME ---------- */
function initHome(){
 $("#qcount").textContent=QS.length;
 $$("input[name=timed]").forEach(r=>{r.checked=(r.value==="1")===cfg.timed;r.onchange=()=>{cfg.timed=r.value==="1";LS.set("e7_timed",cfg.timed?"1":"0");};});
 $("#chkSound").checked=cfg.sound;$("#chkFx").checked=cfg.fx;
 $("#chkSound").onchange=e=>{cfg.sound=e.target.checked;LS.set("e7_sound",cfg.sound?"1":"0");};
 $("#chkFx").onchange=e=>{cfg.fx=e.target.checked;LS.set("e7_fx",cfg.fx?"1":"0");applyFx();};
 $("#btnStart").onclick=()=>openSetup("choose");

 applyFx();
}
function showHow(){
 openModal(`<h3>📘 Hướng dẫn</h3>
 <p><b>FULL EXAM – Thi thử:</b> làm bài như đề thi, không hiện đáp án khi chọn, có thể quay lại, đánh dấu ⚑ câu cần xem lại. Chấm điểm khi nộp bài hoặc hết giờ.</p>
 <p><b>PRACTICE – Luyện tập:</b> chọn chủ đề, có phản hồi ngay sau mỗi câu, giải thích, được <i>thử lại</i> câu sai (thử lại không tính điểm).</p>
 <p><b>TOPIC CHALLENGE – Thử thách theo chủ đề:</b> mỗi chủ đề có điểm và kỷ lục riêng (lưu trên máy này). Trả lời đúng ngay lần đầu và nhanh (≤ 15 giây) được thưởng thêm điểm game.</p>
 <h4>Cách tính điểm</h4>
 <ul><li>Mỗi câu chấm tối đa <b>một lần</b>: đúng = 1 câu đúng; sai hoặc bỏ trống = không có điểm.</li>
 <li><b>Điểm luyện tập</b> = (số câu đúng ÷ tổng số câu) × 10. Đây là điểm quy đổi để tự luyện, <b>không phải điểm thi chính thức</b> (tài liệu nguồn không quy định đầy đủ thang điểm cho từng câu).</li>
 <li>“Điểm game” (⭐) chỉ dùng cho vui ở Practice/Topic Challenge: +10 mỗi câu đúng ngay lần đầu, +5 thưởng tốc độ ở Topic Challenge. Chế độ thi thử không có thưởng tốc độ.</li></ul>
 <h4>Lưu ý</h4>
 <ul><li>Phần <b>Listening</b> trong Đề 1 được trình bày dưới dạng <b>bài đọc transcript</b> (tài liệu không kèm file âm thanh). Nút 🔊 dùng giọng đọc máy của trình duyệt (nếu có) để nghe thử, không phải bản ghi âm gốc.</li>
 <li>Câu viết lại/sắp xếp từ được chấm theo danh sách đáp án chấp nhận (không phân biệt hoa/thường, bỏ qua dấu câu). Nếu bạn viết đúng nhưng khác đáp án mẫu, hãy hỏi giáo viên.</li>
 <li>Phím tắt: A–D (hoặc 1–4) chọn đáp án, T/F cho True/False, ← → chuyển câu, Enter kiểm tra / câu tiếp.</li></ul>
 <div class="row"><button class="btn" id="mClose">Đã hiểu</button></div>`);
 $("#mClose").onclick=closeModal;
}

/* ---------- SETUP ---------- */
let setup={mode:"exam",topic:"mx",count:20,shuffle:true,set:"D1",mins:60,timed:true};
function openSetup(entry){
 setup.mode=entry==="practice"?"practice":(setup.mode||"exam");
 if(entry==="choose")setup.mode="exam";
 setup.timed=setup.mode==="exam"?true:cfg.timed;

function best(k){const v=LS.get("e7_best_"+k);return v===null?null:+v;}
function renderSetup(onlyPractice){
 const el=$("#setupBody");
 const modes=[["exam","FULL EXAM – Thi thử","Giống bài thi, chấm khi nộp bài"],["practice","PRACTICE – Luyện tập","Có phản hồi ngay, được thử lại"],["topic","TOPIC CHALLENGE","Điểm & kỷ lục riêng cho từng chủ đề"]];
 let h=`<h2>⚙️ Chọn chế độ chơi</h2><div class="grid2">`;
 modes.forEach(m=>{if(onlyPractice&&m[0]==="exam")return;h+=`<button class="opt ${setup.mode===m[0]?"sel":""}" data-mode="${m[0]}"><b>${m[1]}</b><small>${m[2]}</small></button>`;});
 h+=`</div>`;
 if(setup.mode==="exam"){

  h+=`</div></div>`;
 }else{

  TOPICS.forEach(t=>{const n=QS.filter(t.f).length,b=best(t.k);h+=`<button class="opt ${setup.topic===t.k?"sel":""}" data-topic="${t.k}"><b>${t.ic} ${t.name}</b><small>${n} câu${setup.mode==="topic"&&b!==null?" · Kỷ lục: "+b+"%":""}</small></button>`;});
  h+=`</div></div>`;
  h+=`<div class="field"><label>Số câu</label><select id="selCount">`;
  [[10,"10 câu"],[20,"20 câu"],[30,"30 câu"],[999,"Tất cả câu của chủ đề"]].forEach(o=>{h+=`<option value="${o[0]}" ${setup.count===o[0]?"selected":""}>${o[1]}</option>`;});
  h+=`</select> <label class="chk" style="margin-left:12px"><input type="checkbox" id="chkShuf" ${setup.shuffle?"checked":""}> Xáo trộn thứ tự</label></div>`;
 }
 h+=`<div class="field"><label class="chk"><input type="checkbox" id="chkTimed" ${setup.timed?"checked":""}> ⏱️ Tính giờ</label> `;
 if(setup.mode==="exam"){
  h+=` <select id="selMins">`+[30,45,60,90,120].map(m=>`<option value="${m}" ${setup.mins===m?"selected":""}>${m} phút</option>`).join("")+`</select><div class="note">Đề 1 gốc ghi 60 phút. Đề cương và bản tổng hợp có nhiều câu hơn nên gợi ý 90 và 120 phút (có thể đổi).</div>`;
 }else{
  h+=`<div class="note">Khi tính giờ: 60 giây cho mỗi câu (tính trên cả lượt chơi).</div>`;
 }
 h+=`</div><div class="nav"><button class="btn sec" id="sBack">← Về trang chủ</button><button class="btn ok" id="sGo">BẮT ĐẦU ▶</button></div>`;
 el.innerHTML=h;
 $$("[data-mode]",el).forEach(b=>b.onclick=()=>{setup.mode=b.dataset.mode;if(setup.mode==="exam")setup.timed=true;else setup.timed=cfg.timed;renderSetup(onlyPractice);});
 $$("[data-set]",el).forEach(b=>b.onclick=()=>{setup.set=b.dataset.set;setup.mins=SETS[setup.set].mins;renderSetup(onlyPractice);});
 $$("[data-topic]",el).forEach(b=>b.onclick=()=>{setup.topic=b.dataset.topic;renderSetup(onlyPractice);});
 const sc=$("#selCount");if(sc)sc.onchange=()=>{setup.count=+sc.value;};
 const sh=$("#chkShuf");if(sh)sh.onchange=()=>{setup.shuffle=sh.checked;};
 $("#chkTimed").onchange=e=>{setup.timed=e.target.checked;};
 const sm=$("#selMins");if(sm)sm.onchange=()=>{setup.mins=+sm.value;};
 $("#sBack").onclick=()=>show("home");
 $("#sGo").onclick=()=>startGame(Object.assign({},setup));
}

/* ---------- GAME STATE ---------- */
let G=null,timerId=null,lastCfg=null,lastCustom=null;
function startGame(c,customList){
 lastCfg=c;lastCustom=customList||null;
 let list;
 if(customList){list=customList;}
 else if(c.mode==="exam"){list=QS.filter(SETS[c.set].f);}
 else{
  const t=TOPICS.find(x=>x.k===c.topic);
  list=QS.filter(t.f);
  if(c.shuffle)list=shuffle(list);
  if(c.count<list.length)list=list.slice(0,c.count);
 }
 if(!list.length){toast("Chưa có câu hỏi cho lựa chọn này.");return;}
 list.forEach(q=>{if(q.type==="order"){let t=q.chunks.map((_,i)=>i),tries=0;do{t=shuffle(t);tries++;}while(t.every((v,i)=>v===i)&&tries<20);q._t=t;}});
 const examLike=c.mode==="exam";
 G={cfg:c,mode:c.mode,list,idx:0,ans:{},flag:{},checked:{},retry:{},res:{},pts:0,start:Date.now(),qStart:Date.now(),trOpen:{},
    timed:!!c.timed,timeLeft:0,done:false,exam:examLike};
 if(G.timed)G.timeLeft=examLike?c.mins*60:list.length*60;
 clearInterval(timerId);
 if(G.timed)timerId=setInterval(tick,1000);
 show("game");renderGame();
}
function tick(){
 if(!G||G.done)return;
 G.timeLeft--;updateTop();
 if(G.timeLeft<=0){toast("⏰ Hết giờ!");finish(true);}
}
function answeredCount(){return G.list.filter(q=>hasAns(q)).length;}
function hasAns(q){const v=G.ans[q.id];if(v===undefined||v===null)return false;if(Array.isArray(v))return v.length>0;if(typeof v==="string")return v.trim()!=="";return true;}

/* ---------- grading ---------- */
function isCorrect(q,v){
 if(v===undefined||v===null)return false;
 if(q.type==="mc"||q.type==="tf")return v===q.ans;
 let s;
 if(q.type==="order"){if(!v.length)return false;s=v.map(i=>q.chunks[i]).join(" ");}
 else{s=String(v);if(!s.trim())return false;}
 let n=norm(s);
 if(q.prefix){const p=norm(q.prefix);if(!(n===p||n.startsWith(p+" ")))n=p+" "+n;}
 return q.accept.some(a=>norm(a)===n);
}
function ansText(q,v){
 if(v===undefined||v===null||(Array.isArray(v)&&!v.length)||v==="")return "(bỏ trống)";
 if(q.type==="mc"||q.type==="tf")return letter(q,v)+". "+optsOf(q)[v];
 if(q.type==="order")return v.map(i=>q.chunks[i]).join(" ")+".";
 return String(v);
}
function correctText(q){if(q.type==="mc"||q.type==="tf")return letter(q,q.ans)+". "+optsOf(q)[q.ans];return q.sample;}

/* ---------- RENDER GAME ---------- */
function ctxHTML(q){
 if(!q.ctx)return "";
 const p=PAS[q.ctx];
 let body=p.html.replace(/\{\{(\d+)\}\}/g,(m,n)=>`<span class="blank ${+n===q.blank?"cur":""}">${n} ${+n===q.blank?"______":"____"}</span>`);
 let tools="";
 if(p.listen){
  const open=!!G.trOpen[q.ctx];
  tools=`<div class="tr-btns"><button class="btn sm sec" data-act="speak">🔊 Nghe (giọng máy)</button><button class="btn sm sec" data-act="trtoggle">${open?"🙈 Ẩn transcript":"📖 Xem transcript"}</button></div><div class="note" style="margin-bottom:6px">Bài nghe được trình bày dạng transcript vì tài liệu không có file âm thanh.</div>`;
  body=open?body:`<i class="note">Transcript đang ẩn. Bấm “Xem transcript” để đọc hoặc “Nghe” để nghe giọng đọc máy.</i>`;
 }
 return `<div class="ctx"><h4>${p.title}</h4>${tools}${body}</div>`;
}
function renderGame(){
 const q=G.list[G.idx];
 G.qStart=Date.now();
 const checked=!!G.checked[q.id]&&!G.retry[q.id];
 let h=`<div class="qcard">`;
 h+=`<div class="meta"><span class="chip">${qLabel(q)}</span><span class="chip">${SKILL[q.skill]}</span><span class="chip u${q.unit}">${UNIT[q.unit]}</span><span class="chip">${["","Dễ","Vừa","Khó"][q.diff]}</span></div>`;
 h+=ctxHTML(q);
 if(q.img)h+=`<img class="qimg" src="${IMG[q.img]}" alt="Sign or notice for ${qLabel(q)}"><div class="imgnote">📎 Hình lấy từ file Word gốc</div>`;
 h+=`<div class="stem">${q.stem}</div>`;
 h+=answerHTML(q,checked);
 h+=`<div id="fbarea">${checked?fbHTML(q):""}</div>`;
 h+=`</div>`;
 $("#qarea").innerHTML=h;
 bindQuestion(q);
 updateTop();renderNav();
}
function answerHTML(q,locked){
 const v=G.ans[q.id],rs=G.res[q.id];
 if(q.type==="mc"||q.type==="tf"){
  const o=optsOf(q);let h=`<div class="answers ${q.type==="tf"?"two":""}">`;
  o.forEach((t,i)=>{
   let cls="ans";
   if(locked){if(i===q.ans)cls+=" right";else if(v===i)cls+=" wrong";}
   else if(v===i)cls+=" sel";
   h+=`<button class="${cls}" data-i="${i}" ${locked?"disabled":""}><span class="l">${letter(q,i)}</span><span>${t}</span></button>`;
  });
  return h+`</div>`;
 }
 let h="";
 if(q.cue)h+=`<div class="cue">Gợi ý: ${q.cue.split(" / ").join(" / ")}</div>`;
 if(q.type==="type"){
  if(q.prefix)h+=`<div class="prefix">${q.prefix} …</div>`;
  h+=`<textarea id="txt" rows="2" placeholder="Nhập câu trả lời của bạn…" ${locked?"disabled":""}>${(v||"").toString().replace(/</g,"&lt;")}</textarea>`;
 }else{
  const placed=Array.isArray(v)?v:[];
  const pool=q._t.filter(i=>!placed.includes(i));
  h+=`<div class="note">Bấm vào các từ/cụm từ theo thứ tự đúng.</div><div class="tiles dest" id="dest">`+placed.map(i=>`<button class="tile" data-p="${i}" ${locked?"disabled":""}>${q.chunks[i]}</button>`).join("")+`<span style="align-self:center">.</span></div><div class="tiles pool" id="pool">`+pool.map(i=>`<button class="tile" data-a="${i}" ${locked?"disabled":""}>${q.chunks[i]}</button>`).join("")+`</div>`;
  if(!locked)h+=`<button class="btn sm sec" id="clr" style="margin-top:8px">↺ Xóa làm lại</button>`;
 }
 if(!G.exam&&!locked)h+=`<div style="margin-top:10px"><button class="btn ok" id="chk">KIỂM TRA ✓</button></div>`;
 return h;
}
function fbHTML(q){
 const rs=G.res[q.id];if(!rs)return "";
 const retried=G.res[q.id].attempts>1;
 const ok=rs.retryOk!==undefined?rs.retryOk:rs.correct;
 let h;
 if(rs.correct||(rs.retryOk)){
  h=`<div class="fb ok"><h4>✅ ${rs.correct?"Excellent! Correct answer!":"Đúng rồi! (lần thử lại – không tính điểm)"}</h4>`;
  if(q.type==="type"||q.type==="order")h+=`<div class="sample">Đáp án mẫu: ${q.sample}</div>`;
  h+=`<div>${q.exp}</div></div>`;
 }else{
  h=`<div class="fb no"><h4>❌ Not quite! Let’s learn from this mistake.</h4><div>Đáp án đúng: <span class="sample">${correctText(q)}</span></div><div style="margin-top:4px">💡 ${q.exp}</div>`;
  h+=`<div style="margin-top:8px"><button class="btn sm warn" id="retry">↻ Thử lại (không tính điểm)</button></div></div>`;
 }
 return h;
}
function bindQuestion(q){
 const root=$("#qarea");
 $$(".ans",root).forEach(b=>b.onclick=()=>pickMC(q,+b.dataset.i));
 const t=$("#txt");
 if(t){t.oninput=()=>{G.ans[q.id]=t.value;updatePal();};t.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(!G.exam)doCheck(q);}};}
 $$(".tile[data-a]",root).forEach(b=>b.onclick=()=>{const a=Array.isArray(G.ans[q.id])?G.ans[q.id].slice():[];a.push(+b.dataset.a);G.ans[q.id]=a;rerenderAnswer(q);});
 $$(".tile[data-p]",root).forEach(b=>b.onclick=()=>{const a=(G.ans[q.id]||[]).filter(x=>x!==+b.dataset.p);G.ans[q.id]=a;rerenderAnswer(q);});
 const c=$("#clr");if(c)c.onclick=()=>{G.ans[q.id]=[];rerenderAnswer(q);};
 const k=$("#chk");if(k)k.onclick=()=>doCheck(q);
 const r=$("#retry");if(r)r.onclick=()=>startRetry(q);
 $$("[data-act=speak]",root).forEach(b=>b.onclick=()=>speak(q));
 $$("[data-act=trtoggle]",root).forEach(b=>b.onclick=()=>{G.trOpen[q.ctx]=!G.trOpen[q.ctx];renderGame();});
}
function speak(q){
 try{
  if(!("speechSynthesis" in window)){toast("Trình duyệt không hỗ trợ giọng đọc máy.");return;}
  const ss=window.speechSynthesis;
  if(ss.speaking){ss.cancel();return;}
  const u=new SpeechSynthesisUtterance(strip(PAS[q.ctx].html.replace(/<\/p>/g,". ")));u.lang="en-US";u.rate=.9;ss.speak(u);
 }catch(e){toast("Không phát được giọng đọc máy.");}
}
function rerenderAnswer(q){
 const checked=!!G.checked[q.id]&&!G.retry[q.id];
 // chỉ vẽ lại phần đáp án + feedback
 const stem=$(".stem");const old=$("#fbarea");
 let n=stem.nextElementSibling;while(n&&n!==old){const nx=n.nextElementSibling;n.remove();n=nx;}
 stem.insertAdjacentHTML("afterend",answerHTML(q,checked));
 bindQuestion(q);updatePal();
}
function pickMC(q,i){
 if(G.done)return;
 if(G.exam){G.ans[q.id]=i;rerenderAnswer(q);return;}
 if(G.checked[q.id]&&!G.retry[q.id])return;
 G.ans[q.id]=i;doCheck(q);
}
function doCheck(q){
 if(G.exam||G.done)return;
 const v=G.ans[q.id];
 if(!hasAns(q)){toast("Hãy trả lời trước khi kiểm tra nhé.");return;}
 const first=!G.res[q.id];
 const ok=isCorrect(q,v);
 if(first){
  const secs=(Date.now()-G.qStart)/1000;
  let pts=0;
  if(ok){pts=10;if(G.mode==="topic"&&secs<=15)pts+=5;G.pts+=pts;}
  G.res[q.id]={correct:ok,given:v,attempts:1,pts};
 }else{
  const r=G.res[q.id];r.attempts++;r.retryOk=ok;
 }
 G.checked[q.id]=true;G.retry[q.id]=false;
 beep(ok);if(ok)confetti();
 rerenderAnswer(q);
 $("#fbarea").innerHTML=fbHTML(q);
 bindQuestion(q);updateTop();renderNav();
}
function startRetry(q){
 G.retry[q.id]=true;G.ans[q.id]=q.type==="order"?[]:(q.type==="type"?"":undefined);
 const r=G.res[q.id];if(r)delete r.retryOk;
 renderGame();
}

/* ---------- TOP / NAV / PALETTE ---------- */
function updateTop(){
 if(!G)return;
 const n=G.list.length;
 $("#pCount").textContent="Câu "+(G.idx+1)+"/"+n;
 $("#pBar").style.width=((G.idx+1)/n*100)+"%";
 if(G.exam)$("#pScore").textContent="✍️ Đã làm: "+answeredCount()+"/"+n;
 else $("#pScore").textContent="⭐ "+G.pts+" điểm game · ✔ "+Object.values(G.res).filter(r=>r.correct).length+"/"+Object.keys(G.res).length;
 const tp=$("#pTime");
 if(G.timed){tp.classList.remove("hidden");tp.textContent="⏱️ "+fmtTime(G.timeLeft);tp.classList.toggle("low",G.timeLeft<=60);}
 else tp.classList.add("hidden");
 $("#pMode").textContent=G.mode==="exam"?"FULL EXAM":G.mode==="topic"?"TOPIC CHALLENGE":G.mode==="review"?"REVIEW MISTAKES":"PRACTICE";
}
function renderNav(){
 const q=G.list[G.idx],last=G.idx===G.list.length-1;
 $("#bBack").disabled=G.idx===0;
 $("#bNext").classList.toggle("hidden",last);
 $("#bNext").textContent="NEXT ▶";
 $("#bFinish").textContent=G.exam?"NỘP BÀI ✔":"KẾT THÚC ✔";
 $("#bFinish").classList.toggle("ok",last);
 const f=$("#bFlag");f.classList.toggle("hidden",!G.exam);f.classList.toggle("on",!!G.flag[q.id]);f.textContent=G.flag[q.id]?"⚑ Đã đánh dấu":"⚐ Đánh dấu xem lại";
}
function palState(q){
 if(G.exam)return hasAns(q)?"ans1":"";
 const r=G.res[q.id];if(!r)return "";return r.correct?"ok":"no";
}
function updatePal(){updateTop();}
function showPalette(){
 let h=`<h3>📋 REVIEW – Danh sách câu hỏi</h3>`;
 const un=G.list.filter(q=>!hasAns(q)&&!G.res[q.id]).length,fl=G.list.filter(q=>G.flag[q.id]).length;
 h+=`<div class="note">${G.exam?`Đã trả lời: ${G.list.length-un} · Chưa làm: ${un} · Đánh dấu: ${fl}`:`Xanh = đúng · Đỏ = sai · Trắng = chưa làm`}</div><div class="pal">`;
 G.list.forEach((q,i)=>{h+=`<button class="pb ${palState(q)} ${i===G.idx?"cur":""} ${G.flag[q.id]?"fl":""}" data-go="${i}">${i+1}</button>`;});
 h+=`</div><div class="row"><button class="btn sec" id="mClose">Đóng</button><button class="btn ok" id="mFin">${G.exam?"Nộp bài":"Kết thúc"}</button></div>`;
 openModal(h);
 $$("[data-go]",$("#modalbox")).forEach(b=>b.onclick=()=>{G.idx=+b.dataset.go;closeModal();renderGame();});
 $("#mClose").onclick=closeModal;$("#mFin").onclick=()=>{closeModal();confirmFinish();};
}
function confirmFinish(){
 const un=G.list.filter(q=>!hasAns(q)&&!G.res[q.id]).length;
 openModal(`<h3>${G.exam?"Nộp bài?":"Kết thúc lượt chơi?"}</h3><p>${un>0?`Bạn còn <b>${un}</b> câu chưa trả lời (sẽ tính là bỏ trống). `:"Bạn đã trả lời tất cả các câu. "}Sau khi kết thúc sẽ không sửa được đáp án.</p>
 <div class="row"><button class="btn sec" id="mNo">Tiếp tục làm</button><button class="btn red" id="mQuit">Thoát, không chấm</button><button class="btn ok" id="mYes">${G.exam?"Nộp bài":"Xem kết quả"}</button></div>`);
 $("#mNo").onclick=closeModal;
 $("#mYes").onclick=()=>{closeModal();finish(false);};
 $("#mQuit").onclick=()=>{closeModal();clearInterval(timerId);G.done=true;show("home");};
}
function go(d){
 const n=G.idx+d;if(n<0||n>=G.list.length)return;
 try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}
 G.idx=n;renderGame();
}

/* ---------- FINISH & RESULT ---------- */
function finish(auto){
 if(!G||G.done)return;
 G.done=true;clearInterval(timerId);
 try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}
 const used=Math.min((Date.now()-G.start)/1000,G.timed&&G.exam?G.cfg.mins*60:1e9);
 const items=G.list.map(q=>{
  let correct=false,blank=false;
  if(G.exam){blank=!hasAns(q);correct=!blank&&isCorrect(q,G.ans[q.id]);}
  else{const r=G.res[q.id];if(!r)blank=true;else correct=!!r.correct;}
  return {q,correct,blank,given:G.exam?G.ans[q.id]:(G.res[q.id]?G.res[q.id].given:undefined)};
 });
 const total=items.length,ok=items.filter(i=>i.correct).length,bl=items.filter(i=>i.blank).length,wr=total-ok-bl;
 const pct=Math.round(ok/total*1000)/10;
 const score10=Math.round(ok/total*100)/10;
 const R={items,total,ok,bl,wr,pct,score10,used,auto};
 G.result=R;
 // kỷ lục
 let rec=false;
 if(G.mode==="topic"){const k=G.cfg.topic;const b=best(k);if(b===null||pct>b){LS.set("e7_best_"+k,String(Math.round(pct)));rec=b!==null;}}
 R.rec=rec;
 renderResult();show("result");
}
function group(items,keyf,namef){
 const m={};items.forEach(i=>{const k=keyf(i.q);(m[k]=m[k]||{ok:0,n:0,name:namef(k)});m[k].n++;if(i.correct)m[k].ok++;});
 return Object.keys(m).map(k=>m[k]);
}
function bars(arr){
 return arr.map(g=>{const p=Math.round(g.ok/g.n*100);return `<div class="skill"><span>${g.name}</span><span class="tr"><i class="${p>=75?"":p>=50?"mid":"low"}" style="width:${p}%"></i></span><span>${g.ok}/${g.n} (${p}%)</span></div>`;}).join("");
}
function renderResult(){
 const R=G.result;
 const lvl=R.pct>=90?["Excellent! 🏆","Quá tuyệt vời! Bạn nắm kiến thức rất chắc."]:R.pct>=75?["Great Job! 🎉","Làm tốt lắm! Ôn thêm vài điểm nhỏ là hoàn hảo."]:R.pct>=50?["Good Effort! 👍","Cố gắng tốt! Hãy xem lại các câu sai để tiến bộ nhanh."]:["Keep Practising! 💪","Đừng nản nhé! Luyện tập từng chút một, bạn sẽ tiến bộ."];
 const sk=group(R.items,q=>q.skill,k=>SKILL[k]);
 const un=group(R.items,q=>q.unit,k=>UNIT[k]);
 const weak=sk.concat(un).filter(g=>g.ok/g.n<.75).sort((a,b)=>a.ok/a.n-b.ok/b.n).slice(0,5);
 const modeName=G.mode==="exam"?"FULL EXAM – "+SETS[G.cfg.set].name:G.mode==="topic"?"TOPIC CHALLENGE – "+TOPICS.find(t=>t.k===G.cfg.topic).name:G.mode==="review"?"REVIEW MISTAKES":"PRACTICE – "+TOPICS.find(t=>t.k===G.cfg.topic).name;
 let h=`<div class="card"><div class="note" style="text-align:center">${modeName}${R.auto?" · (hết giờ – tự động nộp bài)":""}</div>
 <div class="score">${R.score10.toFixed(1)}<span style="font-size:24px">/10</span></div>
 <div class="note" style="text-align:center">Điểm luyện tập (quy đổi thang 10) – không phải điểm thi chính thức</div>
 <div class="badge">${lvl[0]}</div><div style="text-align:center">${lvl[1]}${R.rec?" <b>🎖️ Kỷ lục mới cho chủ đề này!</b>":""}</div>
 <div class="stats"><div class="stat"><b>${R.total}</b>Tổng số câu</div><div class="stat"><b style="color:var(--ok)">${R.ok}</b>Đúng</div><div class="stat"><b style="color:var(--bad)">${R.wr}</b>Sai</div><div class="stat"><b>${R.bl}</b>Bỏ trống</div><div class="stat"><b>${R.pct}%</b>Tỷ lệ chính xác</div><div class="stat"><b>${fmtTime(R.used)}</b>Thời gian</div>${G.exam?"":`<div class="stat"><b>⭐ ${G.pts}</b>Điểm game</div>`}</div>
 <h3>📊 Theo kỹ năng</h3>${bars(sk)}<h3>📊 Theo chủ đề</h3>${bars(un)}`;
 if(weak.length){h+=`<h3>🔁 Nên ôn tập lại</h3><ul>${weak.map(w=>`<li><b>${w.name}</b> (${w.ok}/${w.n} câu đúng)</li>`).join("")}</ul>`;}
 else h+=`<h3>🔁 Nên ôn tập lại</h3><p>Chưa có kỹ năng/chủ đề nào dưới 75%. Tuyệt vời!</p>`;
 const bad=R.items.filter(i=>!i.correct);
 h+=`<h3>❌ Câu sai / bỏ trống (${bad.length})</h3>`;
 if(!bad.length)h+=`<p>Không có câu sai. 🎉</p>`;
 bad.forEach(i=>{const q=i.q;
  const extra=q.blank?` <i>[chỗ trống ${q.blank}]</i>`:"";
  h+=`<div class="wrongitem"><div class="note">${qLabel(q)} · ${SKILL[q.skill]}</div><div class="q">${q.stem}${extra}</div>${q.cue?`<div class="note">Gợi ý: ${q.cue}</div>`:""}<div class="y">Bạn chọn: ${i.blank?"(bỏ trống)":ansText(q,i.given)}</div><div class="c">Đáp án đúng: ${correctText(q)}</div><div>💡 ${q.exp}</div></div>`;});
 h+=`<div class="nav" style="margin-top:20px"><div class="grp"><button class="btn warn" id="rReview" ${bad.length?"":"disabled"}>REVIEW MISTAKES</button><button class="btn" id="rAgain">PLAY AGAIN</button></div><div class="grp"><button class="btn sec" id="rChoose">CHOOSE ANOTHER TOPIC</button><button class="btn sec" id="rHome">BACK TO HOME</button></div></div></div>`;
 $("#resultBody").innerHTML=h;
 $("#rReview").onclick=()=>startGame({mode:"review",timed:false,topic:"mx",count:999,shuffle:false},bad.map(i=>i.q));
 $("#rAgain").onclick=()=>startGame(Object.assign({},lastCfg),lastCustom);
 $("#rChoose").onclick=()=>{setup.mode=(G.mode==="review"?"practice":G.mode);setup.timed=setup.mode==="exam"?true:cfg.timed;renderSetup(false);show("setup");};
 $("#rHome").onclick=()=>show("home");
 if(R.pct>=75){beep(true);confetti();}
}

/* ---------- INIT ---------- */
function initGame(){
 $("#bBack").onclick=()=>go(-1);
 $("#bNext").onclick=()=>go(1);
 $("#bFlag").onclick=()=>{const q=G.list[G.idx];G.flag[q.id]=!G.flag[q.id];renderNav();};
 $("#bReview").onclick=showPalette;
 $("#bFinish").onclick=confirmFinish;
 $("#modal").onclick=e=>{if(e.target.id==="modal")closeModal();};
 document.addEventListener("keydown",e=>{
  if(!G||G.done||$("#screen-game").classList.contains("hidden")||modalOpen())return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="textarea"||tag==="input")return;
  const q=G.list[G.idx];
  const k=e.key.toLowerCase();
  if(k==="arrowright"){go(1);return;}
  if(k==="arrowleft"){go(-1);return;}
  if(q.type==="mc"){const i="abcd".indexOf(k);const j="1234".indexOf(k);const x=i>=0?i:j;if(x>=0&&x<q.opts.length)pickMC(q,x);}
  if(q.type==="tf"){if(k==="t"||k==="1")pickMC(q,0);if(k==="f"||k==="2")pickMC(q,1);}
  if(k==="enter"){if(!G.exam&&(q.type==="order")&&!G.checked[q.id])doCheck(q);else go(1);}
 });
 window.addEventListener("beforeunload",e=>{if(G&&!G.done&&!$("#screen-game").classList.contains("hidden")){e.preventDefault();e.returnValue="";}});
}
initHome();initGame();show("home");
})();

</script>
</body>
